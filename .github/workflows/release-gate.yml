name: Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-gate:
    name: Docker release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check Docker availability
        run: |
          docker version
          docker info

      - name: Prepare container-compatible jq
        env:
          JQ_VERSION: "1.7.1"
          JQ_LINUX_AMD64_SHA256: "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/openclaw-tools/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_LINUX_AMD64_SHA256" "$RUNNER_TEMP/openclaw-tools/jq" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/openclaw-tools/jq"
          echo "$RUNNER_TEMP/openclaw-tools" >> "$GITHUB_PATH"

      - name: Prepare control-plane medium
        run: bash ./scripts/setup/prepare_control_plane_medium.sh

      - name: Check test readiness
        run: bash ./scripts/testing/check_repo_test_readiness.sh

      - name: Validate repository documentation
        run: |
          bash ./scripts/docs/check_documentation_validators.sh
          bash ./scripts/docs/check_generated_docs_sync.sh

      - name: Run repository unittest
        run: |
          mkdir -p state/openclaw/control_plane/tmp/test-reports
          bash ./scripts/testing/run_repo_unittest.sh \
            --report-json state/openclaw/control_plane/tmp/test-reports/repo-unittest.json

      - name: Verify stack source
        run: |
          bash ./scripts/runtime/run_openclaw_python_tool.sh \
            control-plane stack verify --strict-release --json

      - name: Run release gate
        run: bash ./scripts/doctor/run_repo_release_gate.sh --json

      - name: Check full source governance bundle
        run: bash ./scripts/setup/export_clean_delivery_bundle.sh --bundle full-source-governance --check-only
