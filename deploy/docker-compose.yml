x-runtime-governance: &runtime_governance
  restart: unless-stopped
  init: true
  pull_policy: never
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  openclaw-official-gateway:
    <<: *runtime_governance
    env_file:
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway/runtime.gateway.env
    image: ${OPENCLAW_OFFICIAL_GATEWAY_IMAGE:?OPENCLAW_OFFICIAL_GATEWAY_IMAGE_required}
    user: "${OPENCLAW_RUNTIME_UID:?OPENCLAW_RUNTIME_UID_required}:${OPENCLAW_RUNTIME_GID:?OPENCLAW_RUNTIME_GID_required}"
    container_name: openclaw-official-gateway
    tmpfs:
      - /tmp
    pids_limit: 512
    expose:
      - "18789"
    networks:
      openclaw_ingress_net:
        ipv4_address: 172.29.0.11
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN_required}
      OPENCLAW_TLS_CN: ${OPENCLAW_TLS_CN:?OPENCLAW_TLS_CN_required}
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_NO_RESPAWN: "1"
      NODE_COMPILE_CACHE: /tmp/openclaw-compile-cache
      NPM_CONFIG_CACHE: /tmp/.npm
      TZ: ${CONTAINER_TZ:?CONTAINER_TZ_required}
    command: ["openclaw", "gateway", "run", "--port", "18789", "--bind", "lan"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node /home/node/.openclaw/healthchecks/gateway-tcp-liveness.cjs'
        ]
      # 官方 Gateway 首次冷启动会先在 state 目录 staging 插件运行依赖；
      # 端口尚未监听前保持 TCP liveness 严格探测，但 warmup 窗口不能早于依赖 staging 完成。
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 8m
    volumes:
      # RUNTIME_MOUNTS_BEGIN openclaw-official-gateway
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway:/home/node/.openclaw:Z  # Gateway 单根状态目录
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway/local_ro_gateway:/local_ro:ro,Z  # Gateway 只读本地资料目录
      # RUNTIME_MOUNTS_END openclaw-official-gateway

  openclaw-internal-api:
    <<: *runtime_governance
    env_file:
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane/runtime.internal-api.env
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane/runtime.internal-api.app.env
    image: ${OPENCLAW_RUNTIME_PYTHON_IMAGE:?OPENCLAW_RUNTIME_PYTHON_IMAGE_required}
    user: "${OPENCLAW_RUNTIME_UID:?OPENCLAW_RUNTIME_UID_required}:${OPENCLAW_RUNTIME_GID:?OPENCLAW_RUNTIME_GID_required}"
    container_name: openclaw-internal-api
    tmpfs:
      - /tmp
    pids_limit: 256
    expose:
      - "18081"
    networks:
      openclaw_internal_net:
        ipv4_address: 172.29.2.11
    environment:
      TZ: ${CONTAINER_TZ:?CONTAINER_TZ_required}
      OPENCLAW_TLS_CN: ${OPENCLAW_TLS_CN:?OPENCLAW_TLS_CN_required}
      PYTHONPATH: /opt/openclaw-tools/python
      OPENCLAW_TOOLS_ROOT: /opt/openclaw-tools
      OPENCLAW_REPO_ROOT: /opt/openclaw-tools
    command: ["python3", "-m", "openclaw.cli", "control-plane", "api", "internal-runtime"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os,sys,urllib.request; port=os.environ.get(\"OPENCLAW_INTERNAL_API_PORT\",\"18081\"); resp=urllib.request.urlopen(f\"http://127.0.0.1:{port}/healthz\", timeout=5); sys.exit(0 if resp.status == 200 else 1)"'
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # RUNTIME_MOUNTS_BEGIN openclaw-internal-api
      - ../python:/opt/openclaw-tools/python:ro,Z  # 仓库 Python 源码
      - ../config:/opt/openclaw-tools/config:ro,Z  # 仓库配置真源
      - ../docs:/opt/openclaw-tools/docs:ro,Z  # 仓库文档真源
      - ../agent:/opt/openclaw-tools/agent:ro,Z  # 仓库 agent 真源
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane:/home/openclaw/.openclaw:ro,Z  # 控制平面运行态目录（internal-api 只读）
      # RUNTIME_MOUNTS_END openclaw-internal-api


  openclaw-control-plane-scheduler:
    <<: *runtime_governance
    depends_on:
      openclaw-internal-api:
        condition: service_healthy
    env_file:
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane/runtime.scheduler.env
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane/runtime.scheduler.app.env
    image: ${OPENCLAW_RUNTIME_PYTHON_IMAGE:?OPENCLAW_RUNTIME_PYTHON_IMAGE_required}
    user: "${OPENCLAW_RUNTIME_UID:?OPENCLAW_RUNTIME_UID_required}:${OPENCLAW_RUNTIME_GID:?OPENCLAW_RUNTIME_GID_required}"
    container_name: openclaw-control-plane-scheduler
    tmpfs:
      - /tmp
    pids_limit: 256
    networks:
      openclaw_internal_net:
        ipv4_address: 172.29.2.14
    environment:
      TZ: ${CONTAINER_TZ:?CONTAINER_TZ_required}
      OPENCLAW_TLS_CN: ${OPENCLAW_TLS_CN:?OPENCLAW_TLS_CN_required}
      PYTHONPATH: /opt/openclaw-tools/python
      OPENCLAW_TOOLS_ROOT: /opt/openclaw-tools
      OPENCLAW_REPO_ROOT: /opt/openclaw-tools
      OPENCLAW_CONTROL_PLANE_TICK_SECONDS: "15"
      OPENCLAW_CONTROL_PLANE_HEARTBEAT_INTERVAL_SECONDS: "60"
      # delivery_adapter 由 scheduler 承载；运行态应用变量统一由 runtime.scheduler.app.env 派生，不把 dispatch / target / model 变量写死在 compose 服务定义中。
    command: ["python3", "-m", "openclaw.cli", "control-plane", "scheduler-runtime"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -m openclaw.cli control-plane scheduler-runtime --healthcheck --max-stale-seconds 900'
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # RUNTIME_MOUNTS_BEGIN openclaw-control-plane-scheduler
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/control_plane:/home/openclaw/.openclaw:Z  # 控制平面运行态目录（scheduler 可写）
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway:/home/openclaw/.openclaw-gateway:Z  # Gateway 定时任务展示镜像目录（scheduler 刷新 cron UI 状态）
      - ../python:/opt/openclaw-tools/python:ro,Z  # 仓库 Python 源码
      - ../scripts:/opt/openclaw-tools/scripts:ro,Z  # 运行与恢复脚本
      - ../config:/opt/openclaw-tools/config:ro,Z  # 仓库配置真源
      - ../docs:/opt/openclaw-tools/docs:ro,Z  # 仓库文档真源
      - ../agent:/opt/openclaw-tools/agent:ro,Z  # 仓库 agent 真源
      # RUNTIME_MOUNTS_END openclaw-control-plane-scheduler

  # RUNTIME_EXTENSION_SERVICES_BEGIN
  # RUNTIME_EXTENSION_SERVICES_END

  openclaw-private-ingress:
    <<: *runtime_governance
    # ingress 仍需在容器内监听 80/443；在保留 cap_drop: ALL 的前提下，仅回补绑定低端口所需的最小能力。
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    image: ${NGINX_IMAGE:?NGINX_IMAGE_required}
    user: "0:0"
    container_name: openclaw-private-ingress
    depends_on:
      openclaw-official-gateway:
        condition: service_healthy
      openclaw-internal-api:
        condition: service_healthy
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    environment:
      TZ: ${CONTAINER_TZ:?CONTAINER_TZ_required}
      OPENCLAW_TLS_CN: ${OPENCLAW_TLS_CN:?OPENCLAW_TLS_CN_required}
    extra_hosts:
      - "${OPENCLAW_TLS_CN:?OPENCLAW_TLS_CN_required}:127.0.0.1"
    volumes:
      # RUNTIME_MOUNTS_BEGIN openclaw-private-ingress
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway/nginx.gateway.conf:/etc/nginx/nginx.conf:ro,Z  # 渲染后的 ingress Nginx 配置
      - ./nginx/certs:/etc/nginx/certs:ro,Z  # TLS 证书目录
      - ../${HOST_STATE_ROOT:?HOST_STATE_ROOT_required}/gateway/logs/nginx-gateway:/var/log/nginx:Z  # Nginx 日志目录
      # RUNTIME_MOUNTS_END openclaw-private-ingress
    # noinspection ComposeUnknownValues
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        host_ip: "${OPENCLAW_INGRESS_LISTEN_IP:?OPENCLAW_INGRESS_LISTEN_IP_required}"
      - target: 443
        published: "443"
        protocol: tcp
        host_ip: "${OPENCLAW_INGRESS_LISTEN_IP:?OPENCLAW_INGRESS_LISTEN_IP_required}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'nginx -t -c /etc/nginx/nginx.conf >/tmp/nginx-gateway-check.log 2>&1 && nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443'
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      openclaw_ingress_net:
        ipv4_address: 172.29.0.10
      openclaw_internal_net:
        ipv4_address: 172.29.2.10

networks:
  openclaw_ingress_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/28
  openclaw_internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.2.0/28
